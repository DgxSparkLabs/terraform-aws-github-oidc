# Example consumer workflow for the two roles this module creates.
#
# Trust model (must match how the workflow runs):
#   - plan role  trusts  repo:<owner>@<id>/<repo>@<id>:ref:refs/heads/<mainline_branch>
#                        -> assumable only from a push to the mainline branch.
#   - apply role trusts  repo:<owner>@<id>/<repo>@<id>:environment:<apply_environment>
#                        -> assumable only from a job bound to that GitHub environment.
#   - When plan_trusts_pull_requests = true, the plan role ALSO trusts
#     repo:<owner>@<id>/<repo>@<id>:pull_request, so the plan job below can run
#     on pull_request events -- but only while that job sets no environment:.
#
# Wire the module outputs into repository/organization Actions *variables*
# (role ARNs are not secret):
#   AWS_PLAN_ROLE_ARN  = module.github_oidc.plan_role_arn
#   AWS_APPLY_ROLE_ARN = module.github_oidc.apply_role_arn

name: terraform

on:
  push:
    branches: [main] # matches the plan role's ref:refs/heads/main subject
  # Opt-in plan-on-PR: uncomment to also run the *plan* job on pull requests.
  # Requires plan_trusts_pull_requests = true on the module. Fork PRs are not
  # granted id-token:write by default, so they cannot mint a token (unless an
  # admin overrides). The apply job below stays push-only regardless.
  # pull_request:

permissions:
  contents: read
  id-token: write # required so GitHub will mint the OIDC token

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assume the plan role (read-only)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gh-plan
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

  apply:
    needs: plan
    runs-on: ubuntu-latest
    # Never run apply on pull requests: a job that sets environment: gets the
    # :environment:<name> subject, which matches the WRITE apply role. Gating on
    # push keeps the write role unreachable from PRs even if plan-on-PR is on.
    if: github.event_name == 'push'
    # The apply role trusts this environment's subject (no branch component).
    # Protect it with required reviewers AND deployment-branch restrictions
    # (limit to the mainline branch); the trust policy is not branch-scoped.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Assume the apply role (write)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gh-apply
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
      - run: terraform init
      - run: terraform apply tfplan # applies exactly the saved plan; -auto-approve is implied
